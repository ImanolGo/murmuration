[package]
name = "murmuration"
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
description = "Starlings at dusk, in your terminal."
license = "MIT"
authors = ["ImanolGo <ImanolGo@users.noreply.github.com>"]
repository = "https://github.com/ImanolGo/murmuration"
readme = "README.md"
keywords = ["tui", "terminal", "simulation", "flocking", "starling"]
categories = ["command-line-utilities", "simulation", "graphics"]
# The recorded demo (`docs/murmuration.gif`) is ~22 MB, well over crates.io's
# 10 MB crate limit. Keep it in the repository (the README links to it by URL)
# but out of the published package.
exclude = ["docs/", ".github/"]

[package.metadata.wix]
upgrade-guid = "065A504B-12C6-4EEE-9DA9-B99FDBD65258"
path-guid = "F8867722-F694-441C-B8C0-D6772B3D2D48"
license = false
eula = false

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rand = "0.9"
rand_chacha = "0.9"
glam = "0.34"
rayon = "1"
signal-hook = "0.3"

[dev-dependencies]
insta = "1"

[profile.release]
lto = "thin"

# The M1 acceptance tests simulate minutes of flocking; optimise test builds so
# `cargo test` stays quick, and speed up the dev binary a little.
[profile.dev]
opt-level = 1

[profile.test]
opt-level = 2

# The profile that 'dist' will build with.
[profile.dist]
inherits = "release"
lto = "thin"

# Metadata for `cargo deb` (the .deb attached to each release).
[package.metadata.deb]
maintainer = "ImanolGo <ImanolGo@users.noreply.github.com>"
copyright = "2026, ImanolGo"
license-file = ["LICENSE", "0"]
section = "utils"
priority = "optional"
depends = "$auto"
extended-description = "A live, three-dimensional murmuration of starlings, drawn in braille silhouettes against an evening sky."
assets = [
    ["target/release/murmuration", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/murmuration/README.md", "644"],
    ["man/murmuration.1", "usr/share/man/man1/", "644"],
    ["completions/murmuration.bash", "usr/share/bash-completion/completions/murmuration", "644"],
    ["completions/_murmuration", "usr/share/zsh/vendor-completions/_murmuration", "644"],
    ["completions/murmuration.fish", "usr/share/fish/vendor_completions.d/murmuration.fish", "644"],
]

[workspace]
members = [".", "xtask"]
resolver = "3"
