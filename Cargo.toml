[package]
name = "murmuration"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "Starlings at dusk, in your terminal."
license = "MIT"
repository = "https://github.com/ImanolGo/murmuration"
readme = "README.md"
# The recorded demo (`docs/murmuration.gif`) is ~22 MB, well over crates.io's
# 10 MB crate limit. Keep it in the repository (the README links to it by URL)
# but out of the published package.
exclude = ["docs/"]

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rand = "0.9"
rand_chacha = "0.9"
glam = "0.34"
rayon = "1"
signal-hook = "0.3"

[dev-dependencies]
insta = "1"

[profile.release]
lto = "thin"

# The M1 acceptance tests simulate minutes of flocking; optimise test builds so
# `cargo test` stays quick, and speed up the dev binary a little.
[profile.dev]
opt-level = 1

[profile.test]
opt-level = 2
