[package]
name = "murmuration"
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
description = "Starlings at dusk, in your terminal."
license = "MIT"
repository = "https://github.com/ImanolGo/murmuration"
readme = "README.md"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rand = "0.9"
rand_chacha = "0.9"
glam = "0.34"
rayon = "1"

[dev-dependencies]
insta = "1"

[profile.release]
lto = "thin"
